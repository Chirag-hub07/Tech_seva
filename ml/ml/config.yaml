# ExacerbAlert ML configuration.
# Research prototype only - not a clinically validated prediction system.
# All relative paths are resolved against the project root (the parent of ml/).

paths:
  features: data/processed/features/final_feature_dataset.parquet
  labels: data/processed/labels/exacerbation_labels_7d.parquet
  feature_dictionary: data/processed/incoming/feature_dictionary.csv
  # Optional. Original TOLIFE event files (exacerbations.csv per participant).
  # Used for the event-file diagnostics and, when post_event.event_source is
  # "raw", for the complete event list. Never committed to Git.
  raw_event_index_dir: data/raw/TOLIFE_COPD_Dataset/index
  # Generated artifacts (fold assignments contain participant IDs). Git-ignored.
  outputs: ml/outputs

columns:
  participant_id: Participant_ID
  date: Date
  original_target: exacerbation_within_7d
  label_status: label_status
  matched_event_date: matched_event_date
  matched_event_severity: matched_event_severity
  # Columns of the raw TOLIFE exacerbations.csv files.
  raw_event_participant: Kit-id
  raw_event_date: Date
  raw_event_severity: Type

# Columns that may never be used as predictors. Enforced in code.
never_predictors:
  - Participant_ID
  - Date
  - exacerbation_within_7d
  - label_status
  - matched_event_date
  - matched_event_severity
  - target
  - target_status
  - fold
# Any column whose name matches one of these patterns is also rejected.
never_predictor_patterns:
  - "(?i)participant|patient|kit[-_ ]?id|subject[-_ ]?id"
  - "(?i)^date$|event_date|matched_|label_status|exacerbat|severity|^target|^fold"

target:
  horizon_days: 7
  positive_severities: [Moderate, Severe]
  # "tolife_v1_absent_file_negative": per the TOLIFE V1.0 README,
  #   exacerbations.csv exists only for participants with recorded events, so an
  #   absent file means no exacerbations were recorded. Rows of those
  #   participants become negative (0) only when the full horizon window
  #   (Date, Date + 7 days] lies within their available feature follow-up;
  #   otherwise they stay unknown (NaN).
  # "original": use exacerbation_within_7d exactly as produced by notebook 06.
  label_policy: original

prediction_time:
  # Predictions for day d are made at the END of day d, after day-d sensor data
  # are complete. Features may use data up to and including day d; the target
  # window is (d, d + horizon_days]. Features that would require data after
  # the prediction time are forbidden.
  assumption: end_of_day
  # Feature-dictionary Time_Window values matching these patterns are rejected.
  forbidden_time_window_patterns:
    - "(?i)next|future|following|subsequent|ahead|forward"

post_event:
  # Primary analysis: exclude rows dated on the day of, or within this many days
  # after, a documented event of the same participant (patient already
  # exacerbating or recovering). null disables the exclusion.
  primary_washout_days: 14
  # Sensitivity analyses: null = no exclusion.
  sensitivity_washout_days: [null, 28]
  # "labels": events referenced by matched_event_date (lower bound - events not
  #           reachable by any feature row are missing).
  # "raw":    all events from the raw exacerbations.csv files.
  event_source: raw

feature_filters:
  # Applied inside each training fold only.
  max_train_missing_fraction: 0.95
  drop_constant: true
  drop_exact_duplicates: true

feature_sets:
  # All dictionary-documented predictors (after leakage guards).
  all: {}
  # Pre-specified smaller set chosen by feature family (not by outcome data).
  compact:
    include_groups: [daily]
    include_patterns:
      - "(?i)_rolling_7d_"
      - "(?i)_baseline_(standardized_)?deviation$"
      - "(?i)_availability$"
      - "(?i)_coverage_percentage_7d$"
  # Same as compact, without provisional time-in-study proxy features.
  compact_no_time_proxies:
    base: compact
    exclude_patterns:
      - "(?i)_baseline_count$"

# Provisional list of features that may act as time-in-study proxies.
time_in_study_proxy_patterns:
  - "(?i)_baseline_count$"

splits:
  # Participant-grouped, participant-stratified K-fold, repeated with several
  # seeds. Rows are never split randomly across training and validation.
  outer_n_splits: 5
  outer_seeds: [42, 43, 44, 45, 46]
  inner_n_splits: 3
  inner_seed: 2024
  min_positive_participants_per_test_fold: 1
