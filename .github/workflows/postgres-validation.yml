name: Phase 3B PostgreSQL 16 Security & Integration Validation

on:
  push:
    branches:
      - feature/backend-fastapi
      - main
    paths:
      - 'database/migrations/phase_3b/**'
      - 'backend/tests/test_phase_3b_postgres.py'
      - '.github/workflows/postgres-validation.yml'
  pull_request:
    branches:
      - feature/backend-fastapi
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-phase-3b-postgres:
    name: PostgreSQL 16 Security & 29-Vector Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable_ci_password_789
          POSTGRES_DB: exacerbalert_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h localhost -p 5432 -U postgres -d exacerbalert_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest psycopg[binary] pytest-cov

      - name: Verify PostgreSQL 16 Service Container
        run: |
          python -c "import psycopg; conn = psycopg.connect('postgresql://postgres:disposable_ci_password_789@localhost:5432/exacerbalert_ci'); print('PostgreSQL version:', conn.execute('SELECT version();').fetchone()[0]); conn.close()"

      - name: Execute 29-Vector Phase 3B PostgreSQL Integration Test Suite
        # Strictly uses isolated disposable container URL (exacerbalert_ci); live Supabase integration is completely omitted
        env:
          TEST_DATABASE_URL: postgresql://postgres:disposable_ci_password_789@localhost:5432/exacerbalert_ci
        run: |
          pytest backend/tests/test_phase_3b_postgres.py -v -s --tb=short

      - name: Execute Backend Unit and RBAC Test Suite
        run: |
          pytest backend/tests/test_health.py backend/tests/test_auth.py backend/tests/test_rbac.py backend/tests/test_alerts.py backend/tests/test_measurements.py backend/tests/test_patients.py backend/tests/test_predictions.py -v

      - name: Capture PostgreSQL Container Logs (Diagnostics)
        if: always()
        run: |
          docker ps -a
          CONTAINER_ID=$(docker ps -aq --filter ancestor=postgres:16-alpine | head -n 1)
          if [ -n "$CONTAINER_ID" ]; then
            echo "=== PostgreSQL 16 Service Container Logs ==="
            docker logs "$CONTAINER_ID"
          fi
